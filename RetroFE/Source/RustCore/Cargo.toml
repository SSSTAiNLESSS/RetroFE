[package]
name = "retrofe-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Data processing
arrow = "53.3"
parquet = "53.3"
duckdb = { version = "1.1.3", features = ["bundled"] }

# XML parsing
quick-xml = "0.36"

# C++ interop
cxx = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for Phase 3)
tokio = { version = "1.42", features = ["full"], optional = true }

[build-dependencies]
cxx-build = "1.0"

[features]
default = []
async = ["tokio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
